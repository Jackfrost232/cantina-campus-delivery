name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar de novo pela aba Actions, sem commit

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova substitui a que estiver na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Testa e gera o site. Se um teste falhar, nada é publicado.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 2) Publica o que o job anterior gerou (job separado, como no modelo oficial do Pages).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
